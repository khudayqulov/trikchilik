services:
  - type: web
    name: trikchilik
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        value: https://trikchilik.onrender.com
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000

