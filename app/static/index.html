<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f8">
    <title>Tirikchilik — Mahsulotlar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: var(--tg-theme-bg-color, #f6f7f8);
        color: var(--tg-theme-text-color, #17212b);
      }

      body {
        box-sizing: border-box;
        margin: 0;
        min-height: 100vh;
        padding: 24px 18px;
      }

      main {
        max-width: 560px;
        margin: 0 auto;
      }

      h1 {
        font-size: 1.5rem;
        margin: 8px 0;
      }

      p {
        color: var(--tg-theme-hint-color, #707579);
        line-height: 1.5;
      }

      #catalog {
        margin-top: 28px;
        padding: 20px;
        border-radius: 16px;
        background: var(--tg-theme-secondary-bg-color, #fff);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tirikchilik</h1>
      <p>Mahsulotlar</p>
      <section id="catalog" aria-live="polite">Mahsulotlar katalogi hali sozlanmagan.</section>
    </main>
    <script>
      const telegramApp = window.Telegram && window.Telegram.WebApp;
      if (telegramApp) {
        telegramApp.ready();
        telegramApp.expand();
      }

      fetch("/api/products")
        .then((response) => {
          if (!response.ok) throw new Error("Mahsulotlarni yuklab bo‘lmadi.");
          return response.json();
        })
        .then((products) => {
          const catalog = document.querySelector("#catalog");
          if (products.length === 0) return;
          catalog.textContent = "Mahsulotlar katalogi tayyorlanmoqda.";
        })
        .catch(() => {
          document.querySelector("#catalog").textContent =
            "Katalogni yuklab bo‘lmadi. Iltimos, keyinroq urinib ko‘ring.";
        });
    </script>
  </body>
</html>
