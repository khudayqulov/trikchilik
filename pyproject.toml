[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trikchilik"
version = "0.1.0"
description = "Telegram shop bot and Mini App for Tirikchilik"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<3.23",
    "fastapi>=0.110,<1",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

